name: CI/CD Pipeline

on:
  push:
    branches: [development, feat/*]
  pull_request:
    branches: [development]
    types: [opened, edited, synchronize]

jobs:
  pr-title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Semantic Pull Request
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          subjectPattern: ^[a-z].+$
          subjectPatternError: The subject "{{subject}}" must start with a lowercase letter.
          headerPattern: '^(\w*)(?:\(([\w\$\.\-\* ]*)\))?\: (.*)$'
          githubBaseUrl: https://api.github.com

  pr-description-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body;
            if (!body || body.length < 10) {
              core.setFailed("PR description is too short or empty. Please provide a meaningful description.");
            }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm exec eslint .
      - name: Prettier Check
        run: pnpm exec prettier --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run Tests
        run: pnpm test
      - name: Check Coverage
        run: pnpm run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist
            package.json
            pnpm-lock.yaml
            ecosystem.config.cjs

  deploy:
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Copy files via native SCP
        run: |
          echo "${{ secrets.ORACLE_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} "mkdir -p ~/smart-api-temp"
          scp -i private_key.pem -o StrictHostKeyChecking=no -r build-artifacts/* ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:~/smart-api-temp/
          rm -f private_key.pem

      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Ensure target directory exists
            mkdir -p "$HOME/smart-api"

            # Move files from temp to final destination
            cp -r "$HOME/smart-api-temp"/* "$HOME/smart-api/"
            rm -rf "$HOME/smart-api-temp"

            cd "$HOME/smart-api"

            # Check if pnpm is installed, otherwise install it
            if ! command -v pnpm &> /dev/null; then
              sudo npm install -g pnpm@latest
            fi

            # Set environment and install production dependencies only
            export CI=true
            export PNPM_CONFIRM_MODULES_PURGE=false
            pnpm install --prod --frozen-lockfile

            # Create/Update .env file from secrets
            echo "PORT=${{ secrets.PORT || 3000 }}" > .env
            echo "NODE_ENV=production" >> .env
            echo "API_KEY=${{ secrets.API_KEY }}" >> .env
            echo "CLIENT_CODE=${{ secrets.CLIENT_CODE }}" >> .env
            echo "CLIENT_PIN=${{ secrets.CLIENT_PIN }}" >> .env
            echo "CLIENT_TOTP_PIN=${{ secrets.CLIENT_TOTP_PIN }}" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
            echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" >> .env
            echo "USE_SLACK=${{ secrets.USE_SLACK }}" >> .env
            echo "USE_TELEGRAM=${{ secrets.USE_TELEGRAM }}" >> .env
            echo "SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}" >> .env
